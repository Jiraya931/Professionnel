! =====================================================================
! CISCO IOL L2 - COMMUTATEUR D'ACCÈS & DISTRIBUTION (SW1)
! Homelab Proxmox VE 8 / EVE-NG Community / FortiGate 7.4
! Auteur : Ababacar Ousmane Niang
! =====================================================================

hostname SW1
!
spanning-tree mode rapid-pvst
spanning-tree extend system-id
!
vlan 10
 name PRODUCTION_USERS
!
! Interface Trunk vers le Routeur Cisco R1 (Router-on-a-Stick)
interface Ethernet0/0
 description TRUNK_VERS_R1_ROUTER
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 1,10
 no shutdown
!
! Interface d'accès vers le poste client VPCS
interface Ethernet0/1
 description ACCESS_VLAN10_CLIENT_VPCS
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 no shutdown
!
! Interfaces inutilisées désactivées par durcissement L2
interface range Ethernet0/2 - 3
 shutdown
!
end

