# =====================================================================
# FORTINET FORTIGATE 7.4.13 - CONFIGURATION SÉCURITÉ, DMZ & VIRTUAL IP
# Homelab Proxmox VE 8 / EVE-NG Community / FortiGate 7.4
# Auteur : Ababacar Ousmane Niang (Master 2 RESI)
# =====================================================================

# 1. Configuration des interfaces réseau multi-zones
config system interface
    edit "port1"
        set vdom "root"
        set mode dhcp
        set allowaccess ping https ssh http
        set type physical
        set description "WAN_INTERNET_UPLINK"
    next
    edit "port2"
        set vdom "root"
        set mode static
        set ip 172.16.1.1 255.255.255.252
        set allowaccess ping https ssh
        set type physical
        set description "LAN_INTERCO_ROUTER_R1"
    next
    edit "port3"
        set vdom "root"
        set alias "DMZ_SERVERS"
        set mode static
        set ip 172.16.50.254 255.255.255.0
        set allowaccess ping https ssh
        set role dmz
        set type physical
        set description "ZONE_DMZ_SERVEURS"
    next
end

# 2. Objets d'adressage réseau
config firewall address
    edit "SRV_WEB_DMZ"
        set subnet 172.16.50.10 255.255.255.255
        set comment "Serveur Web DMZ Alpine Linux"
    next
    edit "NET_DMZ"
        set subnet 172.16.50.0 255.255.255.0
        set comment "Sous-réseau de la zone DMZ"
    next
    edit "NET_LAN_VLAN10"
        set subnet 10.10.10.0 255.255.255.0
        set comment "VLAN 10 Utilisateurs Campus"
    next
end

# 3. Virtual IP (Port Forwarding WAN vers DMZ)
config firewall vip
    edit "VIP_WEB_DMZ"
        set extip 192.168.1.4
        set mappedip "172.16.50.10"
        set extintf "port1"
        set portforward enable
        set protocol tcp
        set extport 8080
        set mappedport 80
        set comment "Publication externe serveur Web DMZ"
    next
end

# 4. Routage statique de retour vers le sous-réseau VLAN 10
config router static
    edit 1
        set dst 10.10.10.0 255.255.255.0
        set gateway 172.16.1.2
        set device "port2"
    next
end

# 5. Politiques de Pare-feu (Firewall Policies)
config firewall policy
    edit 1
        set name "POL_LAN_TO_WAN_INTERNET"
        set srcintf "port2"
        set dstintf "port1"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set nat enable
        set logtraffic all
    next
    edit 10
        set name "LAN_TO_DMZ_WEB"
        set srcintf "port2"
        set dstintf "port3"
        set action accept
        set srcaddr "all"
        set dstaddr "SRV_WEB_DMZ"
        set schedule "always"
        set service "HTTP" "PING"
        set logtraffic all
    next
    edit 20
        set name "WAN_TO_DMZ_VIP"
        set srcintf "port1"
        set dstintf "port3"
        set action accept
        set srcaddr "all"
        set dstaddr "VIP_WEB_DMZ"
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
end

# 6. Activation et paramétrage des journaux en mémoire locale
config log memory setting
    set status enable
end
config log memory filter
    set severity information
    set forward-traffic enable
end
