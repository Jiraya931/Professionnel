# =====================================================================

# 1. Configuration des interfaces réseau
config system interface
    edit "port1"
        set vdom "root"
        set mode dhcp
        set allowaccess ping https ssh http
        set type physical
        set description "WAN_INTERNET_UPLINK"
    next
    edit "port2"
        set vdom "root"
        set mode static
        set ip 192.168.10.254 255.255.255.0
        set allowaccess ping https ssh
        set type physical
        set description "LAN_INTERCO_ROUTER_R1"
    next
end

# 2. Routage statique de retour vers le sous-réseau VLAN 10
config router static
    edit 1
        set dst 10.10.10.0 255.255.255.0
        set gateway 192.168.10.1
        set device "port2"
    next
end

# 3. Politique de Pare-feu avec translation d'adresses (NAT dynamique)
config firewall policy
    edit 1
        set name "POL_LAN_TO_WAN_INTERNET"
        set srcintf "port2"
        set dstintf "port1"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set nat enable
        set logtraffic all
    next
end

# 4. Activation et paramétrage des journaux en mémoire locale
config log memory setting
    set status enable
end
config log memory filter
    set severity information
    set forward-traffic enable
end
