version: '3.8'

services:
  # Reverse Proxy NGINX avec terminaison TLS / SSL
  reverse-proxy:
    image: nginx:alpine
    container_name: devops-reverse-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - webapp
    networks:
      - front-network

  # Application Web Métier conteneurisée
  webapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devops-webapp
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://dbuser:secure_devops_pwd@db:5432/appdb
      REDIS_URL: redis://cache:6379
    expose:
      - "3000"
    depends_on:
      - db
      - cache
    networks:
      - front-network
      - back-network

  # Base de Données Relationnelle PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: devops-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: secure_devops_pwd
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - back-network

  # Cache mémoire Redis haute performance
  cache:
    image: redis:7-alpine
    container_name: devops-redis-cache
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - back-network

volumes:
  db_data:
  redis_data:

networks:
  front-network:
    driver: bridge
  back-network:
    driver: bridge
