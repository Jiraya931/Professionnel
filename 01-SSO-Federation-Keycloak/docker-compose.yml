version: '3.8'

services:
  # Base de données relationnelle pour Keycloak
  keycloak-db:
    image: postgres:15-alpine
    container_name: simen-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sso-network

  # Annuaire d'identités LDAP souverain (OpenLDAP)
  openldap:
    image: osixia/openldap:1.5.0
    container_name: simen-openldap
    restart: unless-stopped
    environment:
      LDAP_ORGANISATION: "SIMEN Republic"
      LDAP_DOMAIN: "simen.sn"
      LDAP_ADMIN_PASSWORD: "admin_ldap_password"
    ports:
      - "389:389"
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
    networks:
      - sso-network

  # Interface web de gestion LDAP
  phpldapadmin:
    image: osixia/phpldapadmin:0.9.0
    container_name: simen-phpldapadmin
    restart: unless-stopped
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: "openldap"
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "8081:80"
    depends_on:
      - openldap
    networks:
      - sso-network

  # Serveur IAM Keycloak (IDP central pour OpenID Connect, SAML 2.0 & OAuth2)
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: simen-keycloak-idp
    restart: unless-stopped
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_secure_password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_simen_sso
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      - keycloak-db
      - openldap
    networks:
      - sso-network

volumes:
  postgres_data:
  ldap_data:
  ldap_config:

networks:
  sso-network:
    driver: bridge
