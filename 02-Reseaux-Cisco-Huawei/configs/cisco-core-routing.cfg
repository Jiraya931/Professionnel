! ==============================================================================
! ARCHITECTURE RESEAU D'ENTREPRISE MULTI-NIVEAUX (CORE / DISTRIBUTION / ACCESS)
! Auteur: Ababacar Ousmane Niang - Master RESI (Groupe ISI Dakar)
! ==============================================================================

! --- 1. CONFIGURATION DU COMMUTATEUR DE DISTRIBUTION (L3 SWITCH) ---
hostname SW-DISTRIB-01
!
ip routing
!
vlan 10
 name ADMINISTRATION_MGMT
vlan 20
 name DATA_SERVICES
vlan 30
 name VOIP_TELEPHONIE
vlan 99
 name NATIVE_MANAGEMENT
!
interface Port-channel1
 description LACP ETHERCHANNEL VERS SW-DISTRIB-02
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,99
!
interface GigabitEthernet0/1
 channel-group 1 mode active
!
interface GigabitEthernet0/2
 channel-group 1 mode active
!
! --- INTERFACES SVI & PREMIER SAUT DE REDONDANCE (HSRP/VRRP) ---
interface Vlan10
 ip address 192.168.10.2 255.255.255.0
 standby 10 ip 192.168.10.1
 standby 10 priority 110
 standby 10 preempt
!
interface Vlan20
 ip address 192.168.20.2 255.255.255.0
 standby 20 ip 192.168.20.1
 standby 20 priority 110
 standby 20 preempt
!
interface Vlan30
 ip address 192.168.30.2 255.255.255.0
 ip helper-address 192.168.10.100
 standby 30 ip 192.168.30.1
 standby 30 priority 110
 standby 30 preempt
!
! --- 2. PROTOCOLE DE ROUTAGE DYNAMIQUE (OSPFv2 MULTI-ZONE) ---
router ospf 1
 router-id 1.1.1.1
 log-adjacency-changes
 passive-interface default
 no passive-interface GigabitEthernet0/0
 no passive-interface Vlan10
 no passive-interface Vlan20
 network 192.168.10.0 0.0.0.255 area 0
 network 192.168.20.0 0.0.0.255 area 0
 network 10.0.0.0 0.0.0.3 area 0
!
! --- 3. CONFIGURATION DU ROUTEUR BORDURE WAN & NAT/PAT ---
!
hostname R-EDGE-WAN-01
!
ip dhcp excluded-address 192.168.10.1 192.168.10.10
ip dhcp excluded-address 192.168.20.1 192.168.20.10
!
ip dhcp pool POOL-ADMIN
 network 192.168.10.0 255.255.255.0
 default-router 192.168.10.1
 dns-server 8.8.8.8 1.1.1.1
 domain-name entreprise.local
!
ip dhcp pool POOL-DATA
 network 192.168.20.0 255.255.255.0
 default-router 192.168.20.1
 dns-server 8.8.8.8
!
! Access Control List pour NAT Dynamique (PAT)
ip access-list standard ACL_NAT_INTERNAL
 permit 192.168.0.0 0.0.255.255
!
interface GigabitEthernet0/0
 description INTERFACE INTERNE VERS COEUR RESEAU
 ip address 10.0.0.1 255.255.255.252
 ip nat inside
!
interface GigabitEthernet0/1
 description LIAISON WAN VERS ISP
 ip address 203.0.113.2 255.255.255.252
 ip nat outside
!
ip nat inside source list ACL_NAT_INTERNAL interface GigabitEthernet0/1 overload
!
ip route 0.0.0.0 0.0.0.0 203.0.113.1
!
end
